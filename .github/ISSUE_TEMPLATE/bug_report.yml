name: Bug report
description: Something in the tray, flyout, or a provider reading is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, credential files, `.cache` contents, or provider
        response bodies. Suspected credential leaks go to SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Fleet version
      placeholder: 0.2.0 installer, portable ZIP, or a source checkout commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build
      placeholder: winver, for example 11 24H2 (26100.2314)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: dry
    attributes:
      label: Output of the dry run
      description: |
        Source checkout: `.\.venv\Scripts\python.exe tray.py --dry`.
        Percentages are fine to share; redact anything you would rather not.
      render: text
  - type: checkboxes
    id: providers
    attributes:
      label: Providers installed and signed in
      options:
        - label: Claude Code
        - label: Codex
        - label: Grok
        - label: Antigravity
