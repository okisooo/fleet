name: release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write # only used by the tag-gated publish step below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $raw = "${{ inputs.version || github.ref_name }}"
          "version=$($raw -replace '^[vV]', '')" >> $env:GITHUB_OUTPUT
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build portable app
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "${{ steps.meta.outputs.version }}" -ScratchRoot "$env:RUNNER_TEMP\fleet-build"
      - name: Build installer
        shell: pwsh
        env:
          FLEET_VERSION: ${{ steps.meta.outputs.version }}
          FLEET_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $env:FLEET_BUILD_ROOT = Join-Path $env:GITHUB_WORKSPACE 'dist\Fleet'
          $env:FLEET_OUTPUT_ROOT = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $env:FLEET_APP_ICON = Join-Path $env:RUNNER_TEMP 'fleet-build\assets\fleet.ico'
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Fleet.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/Fleet-*-portable.zip, dist/Fleet-Setup-*.exe | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Fleet-windows
          path: |
            dist/*-portable.zip
            dist/Fleet-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            dist/*-portable.zip
            dist/Fleet-Setup-*.exe
            dist/SHA256SUMS.txt
