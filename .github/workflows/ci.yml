name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install detect-secrets==1.5.0
      # `detect-secrets scan` always exits 0, so the findings themselves are the gate.
      - run: detect-secrets scan --all-files > secrets-scan.json
      - name: Fail on any detected secret
        run: |
          python - <<'PY'
          import json, sys

          results = json.load(open("secrets-scan.json"))["results"]
          for path, findings in sorted(results.items()):
              for finding in findings:
                  print(f"{path}:{finding['line_number']}: {finding['type']}")
          sys.exit(1 if results else 0)
          PY
